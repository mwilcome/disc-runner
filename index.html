<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#102418" />
    <meta name="description" content="Disc Runner — a landscape arcade flying-disc game." />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Disc Runner" />
    <title>Disc Runner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

  <body>
    <div id="chrome-spacer" aria-hidden="true"></div>
    <div id="rotate-gate" role="status">
      <p>DISC RUNNER</p>

      <p>This pitch is widescreen. Turn the phone sideways.</p>
    </div>
    <div id="app"></div>
    <p id="chrome-hint" role="status">Swipe up for full screen</p>
    <script type="module" src="/src/main.ts"></script>
